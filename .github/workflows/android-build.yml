name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build signed release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 35 and Build Tools 35.0.0
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create local.properties
        run: |
          # SDK path is provided by the setup-android action via ANDROID_HOME.
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          # Optional API token — build still succeeds and app falls back to demo data if absent.
          if [ -n "${FOOTBALL_DATA_API_TOKEN}" ]; then
            echo "FOOTBALL_DATA_API_TOKEN=${FOOTBALL_DATA_API_TOKEN}" >> local.properties
          else
            echo "FOOTBALL_DATA_API_TOKEN=your_api_token_here" >> local.properties
          fi
          echo "FOOTBALL_API_BASE_URL=https://api.football-data.org/v4" >> local.properties
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. A real release keystore is required for signed builds."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.p12"
          echo "Keystore decoded to ${RUNNER_TEMP}/release.p12"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        run: |
          APKSIGNER="$(ls ${ANDROID_HOME}/build-tools/35.0.0/apksigner)"
          APK="app/build/outputs/apk/release/app-release.apk"
          echo "Verifying $APK"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is signed with a DEBUG certificate. Failing to prevent Google Play rejection."
            exit 1
          fi
          echo "Signature OK — not a debug certificate."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: teamcaptain-notes-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: teamcaptain-notes-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
